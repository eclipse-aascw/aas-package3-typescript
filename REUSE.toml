version = 1

# Prose and metadata where a header would end up in the rendered output
# (e.g., README shown on GitHub and npm, the documentation) or which can not
# carry a comment (JSON).
[[annotations]]
path = [
    "AUTHORS",
    "README.md",
    "CONTRIBUTING.md",
    "doc/**/*.md",
    "package.json",
    "package-lock.json",
    "tsconfig.json",
    ".github/markdown-link-check-config.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 aas-package3-typescript AUTHORS"
SPDX-License-Identifier = "MIT"
